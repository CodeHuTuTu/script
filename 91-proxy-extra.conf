# 代理节点补充调优，配合 optimize-vps.sh 使用（不与其 90-properties-script-vps.conf 重复任何参数）
# 安装: sudo install -m 0644 91-proxy-extra.conf /etc/sysctl.d/ && sudo sysctl --system
# 撤销: sudo rm /etc/sysctl.d/91-proxy-extra.conf，然后重启机器（或手动 sysctl -w 改回原值）

# 连接空闲后不重新慢启动，长连接复用（代理常见）恢复传输更快
net.ipv4.tcp_slow_start_after_idle = 0

# 限制未发送数据在内核里排队的量，配合 BBR 降低延迟、减少内存占用
net.ipv4.tcp_notsent_lowat = 16384

# 遇到 MTU 黑洞（隧道/封装线路常见）时自动探测，避免连接卡死
net.ipv4.tcp_mtu_probing = 1

# 开启 TCP Fast Open（客户端和服务端），减少一次握手往返
net.ipv4.tcp_fastopen = 3

# 加快回收已关闭的连接
net.ipv4.tcp_fin_timeout = 30

# 更早发现失效的长连接（默认 2 小时）
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5

# 提高网卡收包队列，UDP 协议（Hysteria2/TUIC）高包量时减少丢包
net.core.netdev_max_backlog = 16384
